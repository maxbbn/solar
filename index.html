<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>True Scale Solar System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
:root {
  color-scheme: dark;
  --void: #03050a;
  --panel: rgba(8, 12, 21, 0.8);
  --panel-solid: #0a0f1a;
  --rule: rgba(150, 172, 210, 0.16);
  --rule-strong: rgba(150, 172, 210, 0.3);
  --ink: #e8ecf3;
  --dim: #8d97ab;
  --faint: #5d677b;
  --sol: #ffb23e;
  --sol-ink: #1a1102;
  --path: #72a7ff;
  --ok: #6fd6a1;
  --sans: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --serif: "Noto Serif SC", "Songti SC", "STSong", serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--void); color: var(--ink); font: 13px/1.5 var(--sans); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sol); outline-offset: 2px; }

#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

/* Body labels */
.lbl { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 6px; padding: 2px 6px 2px 0; margin: -9px 0 0 -4px;
  background: none; border: 0; pointer-events: auto; white-space: nowrap; color: rgba(232, 236, 243, 0.86); font-size: 12px; letter-spacing: 0.02em;
  text-shadow: 0 0 4px #000, 0 0 2px #000; will-change: transform; }
.lbl i { width: 7px; height: 7px; border-radius: 50%; flex: none; box-shadow: 0 0 6px currentColor; }
.lbl.resolved { margin: -24px 0 0 -4px; }
.lbl.resolved i { opacity: 0; }
.lbl.minor { font-size: 11px; color: rgba(200, 208, 222, 0.7); }
.lbl.minor i { width: 5px; height: 5px; }
.lbl.sun { color: #ffd89a; }
.lbl.craft { color: var(--sol); font-weight: 600; }
.lbl.craft i { border-radius: 1px; transform: rotate(45deg); }
.lbl.iss { color: #efe8d6; }
.lbl.focus span { border-bottom: 1px solid currentColor; }
.lbl:hover span { color: #fff; }
.lbl span { transition: opacity 0.3s; }
.lbl.fast span { opacity: 0; }
.compass { position: absolute; left: 0; top: 0; transform-origin: 0 0; margin: -10px 0 0 -12px; font-size: 13px; font-weight: 500; color: rgba(255, 214, 150, 0.85); text-shadow: 0 0 4px #000; }
.compass.minor { font-size: 11px; color: rgba(255, 214, 150, 0.5); }
.cname { position: absolute; left: 0; top: 0; font-size: 11px; color: rgba(130, 160, 215, 0.7); margin: -8px 0 0 -16px; letter-spacing: 0.1em; }


/* ── Chrome ─────────────────────────────────────────────────────────────── */
.hud { position: fixed; z-index: 2; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
h2 { font: 500 11px/1 var(--sans); letter-spacing: 0.14em; color: var(--dim); margin: 0 0 10px; text-transform: uppercase; }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.brand { top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; pointer-events: none; text-shadow: 0 0 3px rgba(0,0,0,.9), 0 0 14px rgba(0,0,0,.7); }
.brand h1 { margin: 0; font: 900 22px/1.1 var(--serif); letter-spacing: 0.03em; white-space: nowrap; }
.brand h1 span { font: 500 17px var(--mono); color: var(--sol); margin-right: 2px; letter-spacing: 0; }
.brand p { margin: 2px 0 0; color: var(--dim); font-size: 12px; letter-spacing: 0.06em; }

.clock { top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); text-align: center; text-shadow: 0 0 3px rgba(0,0,0,.9), 0 0 14px rgba(0,0,0,.7); max-width: 40vw; }
.clock .date { font: 500 12.5px var(--mono); color: var(--dim); letter-spacing: 0.05em; white-space: nowrap; }
.clock .time { font: 500 30px/1.05 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.clock .badge { display: inline-block; margin-top: 4px; color: var(--dim); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 0 5px; font-size: 11px; }
#clockMission { display: block; margin: 6px auto 0; max-width: 100%; padding: 3px 10px; border-radius: 99px; border: 1px solid rgba(255, 178, 62, 0.35); background: rgba(10, 14, 22, 0.6);
  font: 500 12px var(--mono); color: var(--sol); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#clockMission:hover { background: rgba(255, 178, 62, 0.12); }

/* Left navigation rail + drawers */
#rail { left: 16px; top: calc(86px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 2px; padding: 5px; }
.rbtn { width: 58px; padding: 8px 2px 6px; display: grid; justify-items: center; gap: 4px; border: 0; background: transparent; border-radius: 8px; color: var(--dim); font-size: 11px; line-height: 1.1; text-align: center; overflow-wrap: anywhere; }
.rbtn:hover { color: var(--ink); background: rgba(150, 172, 210, 0.08); }
.rbtn.on { color: var(--sol); background: rgba(255, 178, 62, 0.12); }
.rbtn.only-mobile { display: none; }
.drawer { left: 92px; top: calc(86px + env(safe-area-inset-top, 0px)); width: 300px; max-height: calc(100% - 190px); overflow: auto; padding: 14px; display: none; }
body[data-panel="views"] #pViews, body[data-panel="bodies"] #pBodies, body[data-panel="mission"] #mission { display: block; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.drawer-head h2 { margin: 0; }
.xbtn { width: 26px; height: 26px; display: grid; place-items: center; border: 0; background: transparent; color: var(--dim); border-radius: 6px; }
.xbtn:hover { color: var(--ink); background: rgba(150, 172, 210, 0.1); }
.xbtn .ico { width: 16px; height: 16px; }

.views { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.view { display: grid; grid-template-columns: minmax(0, 1fr); text-align: left; padding: 7px 10px; background: transparent; border: 1px solid transparent; border-radius: 7px; }
.view b { font-weight: 500; font-size: 13px; }
.view small { color: var(--dim); font-size: 11.5px; }
.view:hover { background: rgba(150, 172, 210, 0.08); }
.view.on { border-color: rgba(255, 178, 62, 0.45); background: rgba(255, 178, 62, 0.08); }
.view.on b { color: var(--sol); }
.view:disabled { opacity: 0.4; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { padding: 3px 9px; border-radius: 99px; border: 1px solid var(--rule-strong); background: transparent; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.chip i { width: 6px; height: 6px; border-radius: 50%; }
.chip:hover { border-color: var(--dim); }
.chip.on { background: var(--ink); color: var(--void); border-color: var(--ink); }

/* Right tool rail: layer toggles, immersive, settings. Icon-only, with hover labels */
#tools { right: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 2px; padding: 5px; }
.tbtn { position: relative; width: 38px; height: 38px; display: grid; place-items: center; border: 0; border-radius: 8px; background: transparent; color: var(--faint); }
.tbtn:hover { color: var(--ink); background: rgba(150, 172, 210, 0.08); }
.tbtn[aria-pressed="true"] { color: var(--ink); }
.tbtn[aria-pressed="true"]::after { content: ""; position: absolute; right: 4px; top: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--sol); }
.tbtn.on { color: var(--sol); background: rgba(255, 178, 62, 0.12); }
.tbtn .tip { position: absolute; right: calc(100% + 8px); top: 50%; transform: translateY(-50%); padding: 4px 8px; border-radius: 6px; background: var(--panel-solid); border: 1px solid var(--rule);
  color: var(--ink); font-size: 12px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .12s; }
.tbtn:hover .tip, .tbtn:focus-visible .tip { opacity: 1; }
.tsep { height: 1px; margin: 4px 6px; background: var(--rule); }

/* Info card (top right, collapsed by default) */
#infoCard { right: 76px; top: calc(14px + env(safe-area-inset-top, 0px)); width: 290px; max-height: calc(100% - 120px); overflow: auto; }
#infoToggle { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 10px 12px; border: 0; background: transparent; text-align: left; }
#infoToggle .ico { width: 16px; height: 16px; color: var(--dim); transition: transform .15s; }
body[data-info="open"] #infoToggle .ico { transform: rotate(180deg); }
#infoTitle { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
#infoTitle b { font: 700 16px/1.25 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#infoSub { display: block; color: var(--dim); font: 11.5px var(--mono); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#info { display: none; padding: 0 12px 12px; }
body[data-info="open"] #info { display: block; }
.kind { font-size: 11px; color: var(--dim); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 0 6px; white-space: nowrap; font-family: var(--sans); }
.rows { display: grid; gap: 6px; margin: 0; }
.rows div { display: grid; grid-template-columns: minmax(64px, auto) minmax(0, 1fr); gap: 10px; }
.rows dt { color: var(--dim); font-size: 12px; }
.rows dd { margin: 0; font: 12.5px/1.45 var(--mono); font-variant-numeric: tabular-nums; }
.rows dd em { font-style: normal; color: var(--dim); font-family: var(--sans); font-size: 11.5px; }
.fact { margin: 10px 0 0; padding-top: 10px; border-top: 1px solid var(--rule); color: #c9d1de; font-size: 12.5px; line-height: 1.6; }
.btn { padding: 6px 12px; border-radius: 7px; border: 1px solid var(--rule-strong); background: rgba(150, 172, 210, 0.06); font-size: 12.5px; }
.btn:hover { border-color: var(--dim); }
.btn.primary { background: var(--sol); color: var(--sol-ink); border-color: var(--sol); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.note-sm { margin: 8px 0 0; color: var(--dim); font-size: 11.5px; line-height: 1.5; }
.pulse { margin-top: 10px; padding: 8px 10px; border-radius: 7px; background: rgba(255, 210, 120, 0.07); border: 1px solid rgba(255, 210, 120, 0.2); font-size: 12px; }
.pulse b { font: 500 12.5px var(--mono); color: #ffd98f; }

/* Mission drawer content */
.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--rule-strong); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 2px; font-size: 12.5px; border-left: 1px solid var(--rule); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--ink); color: var(--void); font-weight: 500; }
.field { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; color: var(--dim); font-size: 12px; }
select { background: var(--panel-solid); border: 1px solid var(--rule-strong); border-radius: 6px; padding: 4px 6px; font-size: 12.5px; max-width: 100%; }
.plan { margin-top: 10px; font-size: 12.5px; color: #c9d1de; line-height: 1.6; }
.plan strong { color: var(--ink); font-weight: 600; }
.plan .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.plan .note { color: var(--dim); font-size: 11.5px; }
.pork { margin-top: 8px; }
.pork canvas { width: 100%; height: 132px; display: block; border-radius: 6px; background: #060a12; cursor: crosshair; }
.pork .axes { display: flex; justify-content: space-between; gap: 6px; color: var(--faint); font: 10.5px var(--mono); margin-top: 3px; }
.phase { margin: 2px 0 8px; }
.phase b { display: block; font: 700 17px/1.3 var(--serif); color: var(--sol); }
.phase span { color: #c9d1de; font-size: 12.5px; }
.met { font: 500 22px var(--mono); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.timeline { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 2px; border-left: 1px solid var(--rule-strong); }
.timeline li button { width: 100%; text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 4px 8px 4px 12px; border: 0; background: transparent; border-radius: 0 6px 6px 0; position: relative; font-size: 12.5px; color: var(--dim); }
.timeline li button::before { content: ""; position: absolute; left: -4px; top: 10px; width: 7px; height: 7px; border-radius: 50%; background: var(--void); border: 1px solid var(--faint); }
.timeline li.done button { color: #c9d1de; }
.timeline li.done button::before { background: var(--dim); border-color: var(--dim); }
.timeline li.now button { color: var(--sol); background: rgba(255, 178, 62, 0.08); }
.timeline li.now button::before { background: var(--sol); border-color: var(--sol); box-shadow: 0 0 8px var(--sol); }
.timeline li button:hover { background: rgba(150, 172, 210, 0.08); }
.timeline small { font: 11px var(--mono); color: var(--faint); }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--dim); cursor: pointer; }
.check input { accent-color: var(--sol); margin: 0; }

/* Contextual HUDs (surface / onboard) */
.ctxhud { left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); padding: 10px 12px; display: grid; gap: 8px; width: min(620px, calc(100% - 32px)); }
.sh-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.sh-read { font: 12px var(--mono); color: #c9d1de; font-variant-numeric: tabular-nums; }
.sh-read em { font-style: normal; color: var(--sol); }
#cockRead b { color: var(--sol); font-weight: 600; font-family: var(--sans); }
#cockRead em.hot { color: #ff9b4a; font-style: normal; }
.sh-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.zoom { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 160px; color: var(--dim); font-size: 12px; }
.zoom input { flex: 1; min-width: 0; accent-color: var(--sol); }
#prograde { position: fixed; left: 0; top: 0; z-index: 1; width: 30px; height: 30px; margin: -15px 0 0 -15px; pointer-events: none; color: rgba(140, 255, 180, 0.85); }
#prograde svg { width: 100%; height: 100%; display: block; }

#scalebar { left: 50%; transform: translateX(-50%); text-align: center; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); pointer-events: none; font: 11.5px var(--mono); color: #c9d1de; text-shadow: 0 0 4px #000; }
#scalebar .bar { height: 6px; border: 1px solid rgba(232,236,243,.8); border-top: 0; margin: 0 auto 4px; }

/* Time dock */
#dock { left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding: 6px; display: flex; gap: 4px; align-items: center; max-width: calc(100% - 32px); }
.ibtn { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 8px; border: 0; background: transparent; color: var(--ink); }
.ibtn:hover { background: rgba(150,172,210,.1); }
.ibtn svg { width: 16px; height: 16px; fill: currentColor; }
.ibtn .ico { width: 18px; height: 18px; fill: none; }
.ibtn.on { background: var(--sol); color: var(--sol-ink); }
#clockRate { min-width: 86px; padding: 0 6px; text-align: center; font: 500 12.5px var(--mono); color: var(--sol); white-space: nowrap; }
.sep { width: 1px; align-self: stretch; margin: 4px 2px; background: var(--rule); flex: none; }
#dock .btn { padding: 6px 10px; white-space: nowrap; border: 0; background: transparent; }
#dock .btn:hover { background: rgba(150,172,210,.1); }

/* Popovers */
.pop { z-index: 4; padding: 14px; display: grid; gap: 14px; }
#timePop { left: 50%; transform: translateX(-50%); bottom: calc(70px + env(safe-area-inset-bottom, 0px)); width: min(460px, calc(100% - 32px)); }
#settingsPop { right: 72px; top: calc(14px + env(safe-area-inset-top, 0px)); width: min(300px, calc(100% - 100px)); }
.pop section { display: grid; gap: 8px; }
.pop h2 { margin: 0; }
.rates { display: flex; flex-wrap: wrap; gap: 4px; }
.rates button { padding: 5px 9px; border: 1px solid var(--rule); background: transparent; border-radius: 6px; font: 500 12px var(--mono); color: var(--dim); white-space: nowrap; }
.rates button:hover { color: var(--ink); }
.rates button.on { background: rgba(255, 178, 62, 0.14); border-color: rgba(255, 178, 62, 0.45); color: var(--sol); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#jumpInput { background: var(--panel-solid); border: 1px solid var(--rule-strong); border-radius: 6px; padding: 5px 6px; font: 12px var(--mono); flex: 1; min-width: 170px; }
.keys { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; font-size: 12px; color: #c9d1de; }
.keys kbd { font: 11.5px var(--mono); color: var(--ink); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 0 5px; justify-self: start; }
.credit { font-size: 11.5px; color: var(--dim); line-height: 1.6; margin: 0; }
.credit a { color: inherit; }

#toast { position: fixed; z-index: 5; left: 50%; top: calc(110px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -8px); max-width: min(520px, calc(100% - 32px));
  padding: 9px 14px; border-radius: 8px; background: rgba(255, 178, 62, 0.95); color: var(--sol-ink); font-weight: 500; font-size: 13px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#loading { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding-inline: 24px; text-align: center; line-height: 1.8; background: var(--void); color: var(--dim); font: 14px var(--sans); letter-spacing: .1em; transition: opacity .6s; }
#loading.gone { opacity: 0; pointer-events: none; }
#loading b { display: block; font: 900 30px var(--serif); color: var(--ink); letter-spacing: .04em; margin-bottom: 8px; text-align: center; }
#loading b span { font: 500 25px var(--mono); color: var(--sol); margin-right: 4px; }

/* Immersive: only the scene (and its labels, if on) */
#immExit { position: fixed; z-index: 6; top: calc(14px + env(safe-area-inset-top, 0px)); right: 16px; display: none; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 99px;
  border: 1px solid var(--rule-strong); background: rgba(8, 12, 21, 0.7); color: var(--ink); font-size: 12.5px; opacity: 0; transition: opacity .4s; }
#immExit .ico { width: 16px; height: 16px; }
body.imm #immExit { display: inline-flex; }
body.imm.stir #immExit, #immExit:hover, #immExit:focus-visible { opacity: 1; }
body.imm [data-chrome], body.imm #prograde { display: none !important; }

@media (max-width: 1100px) {
  .brand p { display: none; }
  #infoCard { width: 250px; }
}
@media (max-width: 960px) {
  #infoCard { width: 200px; }
  .clock .time { font-size: 26px; }
}
@media (max-width: 760px) {
  .brand h1 { font-size: 16px; white-space: normal; max-width: 9.5em; line-height: 1.15; } .brand h1 span { font-size: 14px; display: block; }
  .clock { left: auto; right: 16px; transform: none; text-align: right; max-width: 60vw; }
  .clock .time { font-size: 22px; }
  #clockMission { margin-right: 0; }
  #tools { top: calc(64px + env(safe-area-inset-top, 0px)); right: 12px; }
  #tools .tbtn { width: 34px; height: 34px; }
  #rail { left: 16px; right: 16px; top: auto; bottom: calc(68px + env(safe-area-inset-bottom, 0px)); flex-direction: row; justify-content: space-around; }
  .rbtn { width: auto; flex: 1; }
  .rbtn.only-mobile { display: grid; }
  .drawer, #infoCard { left: 16px; right: 16px; top: auto; width: auto; bottom: calc(136px + env(safe-area-inset-bottom, 0px)); max-height: calc(100% - 420px); min-height: 180px; }
  #infoCard { display: none; }
  body[data-panel="info"] #infoCard { display: block; }
  body[data-panel="info"] #info { display: block; }
  body[data-panel="info"] #infoToggle .ico { display: none; }
  #dock { left: 16px; right: 16px; transform: none; max-width: none; justify-content: space-between; }
  .ctxhud { bottom: calc(136px + env(safe-area-inset-bottom, 0px)); }
  body:not([data-panel="none"]) .ctxhud { display: none; }
  #scalebar { bottom: calc(136px + env(safe-area-inset-bottom, 0px)); }
  #timePop { bottom: calc(68px + env(safe-area-inset-bottom, 0px)); }
  #settingsPop { right: 16px; left: 16px; width: auto; top: auto; bottom: calc(136px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { #toast, #loading, #immExit { transition: none; } }
</style>
</head>
<body data-sheet="none" data-panel="none" data-info="closed">
<canvas id="scene" aria-label="太阳系三维视图" data-en-aria="3D view of the Solar System"></canvas>
<div id="labels"></div>

<header class="hud brand" data-chrome><h1><span>True Scale</span> Solar System</h1><p data-en="Live ephemeris · real distances">真实比例 · 实时星历</p></header>

<div class="hud clock" data-chrome>
  <div class="date" id="clockDate">—</div>
  <div class="time" id="clockTime">—</div>
  <span class="badge" id="clockBadge" hidden data-en="Extrapolated ephemeris">星历外推</span>
  <button id="clockMission" hidden title="打开任务面板" data-en-title="Open the mission panel"></button>
</div>

<!-- Left navigation: one drawer at a time -->
<nav class="hud panel" id="rail" data-chrome aria-label="功能" data-en-aria="Panels">
  <button class="rbtn" data-panel="views"><svg class="ico" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span data-en="Views">视角</span></button>
  <button class="rbtn" data-panel="bodies"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><ellipse cx="12" cy="12" rx="10.5" ry="3.6" transform="rotate(-20 12 12)"/></svg><span data-en="Bodies">天体</span></button>
  <button class="rbtn" data-panel="mission"><svg class="ico" viewBox="0 0 24 24"><path d="M12 2.5c3 2.4 4.4 5.9 4.4 10.3L14.2 16H9.8l-2.2-3.2C7.6 8.4 9 4.9 12 2.5z"/><circle cx="12" cy="9" r="1.6"/><path d="M7.6 12.8 5 15.4v2.8l3.6-1.6M16.4 12.8l2.6 2.6v2.8l-3.6-1.6M10.5 16.5 12 21l1.5-4.5"/></svg><span data-en="Mission">任务</span></button>
  <button class="rbtn only-mobile" data-panel="info"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.6v.2"/></svg><span data-en="Info">信息</span></button>
</nav>

<section class="hud panel drawer" id="pViews" data-chrome>
  <div class="drawer-head"><h2 data-en="Views">视角</h2><button class="xbtn" data-close title="关闭" data-en-title="Close"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="views" id="views"></div>
</section>
<section class="hud panel drawer" id="pBodies" data-chrome>
  <div class="drawer-head"><h2 data-en="Bodies">天体</h2><button class="xbtn" data-close title="关闭" data-en-title="Close"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="chips" id="bodies"></div>
</section>
<section class="hud panel drawer" id="mission" data-chrome></section>

<!-- Info card: what the camera is looking at -->
<section class="hud panel" id="infoCard" data-chrome>
  <button id="infoToggle" aria-expanded="false"><span><span id="infoTitle"></span><span id="infoSub"></span></span><svg class="ico" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
  <div id="info"></div>
</section>

<!-- Right tools: layer toggles are always visible -->
<div class="hud panel" id="tools" data-chrome>
  <button class="tbtn" id="tLabels" aria-pressed="true"><svg class="ico" viewBox="0 0 24 24"><path d="M3.5 11.5V4h7.5l9.5 9.5-7.5 7.5z"/><circle cx="7.8" cy="8.2" r="1.4"/></svg><span class="tip" data-en="Labels">标签</span></button>
  <button class="tbtn" id="tOrbits" aria-pressed="true"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-dasharray="2.6 2.4"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/><circle cx="17.7" cy="6.3" r="1.9" fill="currentColor" stroke="none"/></svg><span class="tip" data-en="Orbits &amp; flight paths">轨道与航线</span></button>
  <button class="tbtn" id="tConst" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24"><path d="m4 17 5-6 5 3 6-8"/><circle cx="4" cy="17" r="1.3" fill="currentColor"/><circle cx="9" cy="11" r="1.3" fill="currentColor"/><circle cx="14" cy="14" r="1.3" fill="currentColor"/><circle cx="20" cy="6" r="1.3" fill="currentColor"/></svg><span class="tip" data-en="Constellations">星座</span></button>
  <div class="tsep"></div>
  <button class="tbtn" id="btnImm"><svg class="ico" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="tip" data-en="Immersive mode (I)">沉浸模式（I）</span></button>
  <button class="tbtn" id="btnSettings"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg><span class="tip" data-en="Settings">设置</span></button>
</div>

<section class="hud panel pop" id="settingsPop" hidden data-chrome>
  <section>
    <h2 data-en="Language">语言</h2>
    <select id="langSel" aria-label="语言 / Language"><option value="auto">自动 · Auto</option><option value="zh">中文</option><option value="en">English</option></select>
  </section>
  <section>
    <h2 data-en="Shortcuts">快捷键</h2>
    <dl class="keys">
      <dt><kbd>Space</kbd></dt><dd data-en="Pause / resume">暂停 / 继续</dd>
      <dt><kbd>, .</kbd></dt><dd data-en="Slower / faster">减速 / 加速</dd>
      <dt><kbd>I</kbd></dt><dd data-en="Immersive mode">沉浸模式</dd>
      <dt><kbd>L O C</kbd></dt><dd data-en="Labels, orbits, constellations">标签、轨道、星座</dd>
      <dt><kbd>Esc</kbd></dt><dd data-en="Close panels / leave immersive">关闭面板 / 退出沉浸</dd>
    </dl>
  </section>
  <section>
    <h2 data-en="Credits">致谢</h2>
    <p class="credit" data-en='Planet textures © <a href="https://www.solarsystemscope.com/textures/" target="_blank" rel="noopener">Solar System Scope</a>, CC BY 4.0 · Stars and constellation lines: d3-celestial (BSD-3) · Ephemeris: JPL approximate orbital elements · ISS orbit: CelesTrak TLE'>行星贴图 © <a href="https://www.solarsystemscope.com/textures/" target="_blank" rel="noopener">Solar System Scope</a>，CC BY 4.0 · 星表与星座连线：d3-celestial（BSD-3）· 星历：JPL 近似轨道根数 · 空间站轨道：CelesTrak TLE</p>
  </section>
</section>

<div class="hud panel ctxhud" id="surfaceHud" hidden data-chrome>
  <div class="sh-top">
    <div class="sh-row">
      <select id="siteSel" aria-label="所在地点" data-en-aria="Location"></select>
      <span class="sh-row" id="lookBtns"></span>
      <button class="btn" id="btnPass" hidden data-en="Next ISS pass" title="快进到空间站下一次在夜空中飞过" data-en-title="Jump to the next time the ISS crosses the night sky">等空间站飞过</button>
    </div>
    <button class="btn" id="btnLeave" data-en="Back to space">回到太空</button>
  </div>
  <div class="sh-read" id="surfRead"></div>
  <label class="zoom" for="fovRange"><span data-en="Zoom">望远镜</span><input type="range" id="fovRange" min="0" max="1000" value="700"><span id="fovText" class="sh-read">60°</span></label>
</div>

<div class="hud panel ctxhud" id="cockpitHud" hidden data-chrome>
  <div class="sh-top">
    <span class="sh-row" id="cockLooks"></span>
    <button class="btn" id="btnCockExit" data-en="Exit onboard view">退出驾驶视图</button>
  </div>
  <div class="sh-read" id="cockRead"></div>
</div>
<div id="prograde" hidden title="飞行方向" data-en-title="Direction of flight"><svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="15" cy="15" r="6"/><path d="M15 3v6M3 15h6M21 15h6"/></svg></div>

<div class="hud" id="scalebar" data-chrome><div class="bar" id="scaleBar"></div><span id="scaleText"></span></div>

<nav class="hud panel" id="dock" aria-label="时间控制" data-en-aria="Time controls" data-chrome>
  <button class="ibtn" id="btnRev" title="时间倒流" aria-label="时间倒流" data-en-title="Reverse time" data-en-aria="Reverse time"><svg viewBox="0 0 16 16"><path d="M8 3V0L3 4.5 8 9V6a4 4 0 1 1-4 4H2a6 6 0 1 0 6-7z"/></svg></button>
  <button class="ibtn" id="btnPlay" title="暂停 / 继续（空格）" data-en-title="Pause / resume (Space)" aria-label="暂停"><svg viewBox="0 0 16 16" id="playIcon"><path d="M4 2h3v12H4zM9 2h3v12H9z"/></svg></button>
  <button class="ibtn" id="btnSlower" title="减速" aria-label="减速" data-en-title="Slower" data-en-aria="Slower"><svg class="ico" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
  <span id="clockRate" aria-live="off">—</span>
  <button class="ibtn" id="btnFaster" title="加速" aria-label="加速" data-en-title="Faster" data-en-aria="Faster"><svg class="ico" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
  <div class="sep"></div>
  <button class="btn" id="btnNow" data-en="Now">现在</button>
  <button class="ibtn" id="btnTime" title="速度、日期与天象" aria-label="速度、日期与天象" data-en-title="Speed, date and events" data-en-aria="Speed, date and events"><svg class="ico" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
</nav>

<section class="hud panel pop" id="timePop" hidden data-chrome>
  <section>
    <h2 data-en="Speed">速度</h2>
    <div class="rates" id="rates"></div>
  </section>
  <section>
    <h2 data-en="Go to a date">跳转日期</h2>
    <div class="row"><input type="datetime-local" id="jumpInput" aria-label="跳转到日期时间" data-en-aria="Jump to date and time"><button class="btn" id="btnJump" data-en="Go">跳转</button></div>
  </section>
  <section>
    <h2 data-en="Sky events">天象</h2>
    <div class="row"><button class="btn" id="btnSolar" data-en="Next solar eclipse">下次日食</button><button class="btn" id="btnLunar" data-en="Next lunar eclipse">下次月食</button></div>
  </section>
</section>

<button id="immExit"><svg class="ico" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg><span data-en="Exit immersive · Esc">退出沉浸 · Esc</span></button>
<div id="toast" role="status"></div>
<div id="loading"><div data-en="<b><span>True Scale</span> Solar System</b>Loading planets and stars…"><b><span>True Scale</span> Solar System</b>正在载入行星与星空…</div></div>
<script src="js/i18n.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="assets/textures.js"></script>
<script src="assets/sky.js"></script>
<script src="js/astro.js"></script>
<script src="js/missions.js"></script>
<script src="js/iss.js"></script>
<script src="js/scene.js"></script>
<script src="js/app.js"></script>
</body>
</html>
