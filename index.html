<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>太阳系 1:1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
:root {
  color-scheme: dark;
  --void: #03050a;
  --panel: rgba(8, 12, 21, 0.8);
  --panel-solid: #0a0f1a;
  --rule: rgba(150, 172, 210, 0.16);
  --rule-strong: rgba(150, 172, 210, 0.3);
  --ink: #e8ecf3;
  --dim: #8d97ab;
  --faint: #5d677b;
  --sol: #ffb23e;
  --sol-ink: #1a1102;
  --path: #72a7ff;
  --ok: #6fd6a1;
  --sans: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --serif: "Noto Serif SC", "Songti SC", "STSong", serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--void); color: var(--ink); font: 13px/1.5 var(--sans); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sol); outline-offset: 2px; }

#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

/* Body labels */
.lbl { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 6px; padding: 2px 6px 2px 0; margin: -9px 0 0 -4px;
  background: none; border: 0; pointer-events: auto; white-space: nowrap; color: rgba(232, 236, 243, 0.86); font-size: 12px; letter-spacing: 0.02em;
  text-shadow: 0 0 4px #000, 0 0 2px #000; will-change: transform; }
.lbl i { width: 7px; height: 7px; border-radius: 50%; flex: none; box-shadow: 0 0 6px currentColor; }
.lbl.resolved { margin: -24px 0 0 -4px; }
.lbl.resolved i { opacity: 0; }
.lbl.minor { font-size: 11px; color: rgba(200, 208, 222, 0.7); }
.lbl.minor i { width: 5px; height: 5px; }
.lbl.sun { color: #ffd89a; }
.lbl.craft { color: var(--sol); font-weight: 600; }
.lbl.craft i { border-radius: 1px; transform: rotate(45deg); }
.lbl.iss { color: #efe8d6; }
.lbl.focus span { border-bottom: 1px solid currentColor; }
.lbl:hover span { color: #fff; }
.compass { position: absolute; left: 0; top: 0; transform-origin: 0 0; margin: -10px 0 0 -12px; font-size: 13px; font-weight: 500; color: rgba(255, 214, 150, 0.85); text-shadow: 0 0 4px #000; }
.compass.minor { font-size: 11px; color: rgba(255, 214, 150, 0.5); }
.cname { position: absolute; left: 0; top: 0; font-size: 11px; color: rgba(130, 160, 215, 0.7); margin: -8px 0 0 -16px; letter-spacing: 0.1em; }

/* Chrome */
.hud { position: fixed; z-index: 2; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
h2 { font: 500 11px/1 var(--sans); letter-spacing: 0.16em; color: var(--dim); margin: 0 0 8px; text-transform: uppercase; }

.brand { top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; pointer-events: none; }
.brand h1 { margin: 0; font: 900 24px/1.1 var(--serif); letter-spacing: 0.04em; }
.brand h1 span { font: 500 20px var(--mono); color: var(--sol); margin-left: 4px; letter-spacing: 0; }
.brand p { margin: 2px 0 0; color: var(--dim); font-size: 12px; letter-spacing: 0.08em; }
.brand-row { display: flex; align-items: center; gap: 10px; }
#langSel { pointer-events: auto; font-size: 11.5px; padding: 2px 4px; color: var(--dim); background: rgba(10, 15, 26, 0.7); }

.clock { top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
.clock .date { font: 500 13px var(--mono); color: var(--dim); letter-spacing: 0.06em; }
.clock .time { font: 500 30px/1.05 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.clock, .brand { text-shadow: 0 0 3px rgba(0,0,0,.9), 0 0 14px rgba(0,0,0,.7); }
.clock .rate { display: inline-flex; gap: 8px; align-items: center; margin-top: 4px; font: 500 12px var(--mono); color: var(--sol); }
.clock .rate .badge { color: var(--dim); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 0 5px; font-family: var(--sans); font-size: 11px; }

#left { top: calc(80px + env(safe-area-inset-top, 0px)); left: 16px; width: 228px; max-height: calc(100% - 200px); overflow: auto; padding: 14px; display: grid; gap: 16px; }
.views { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
#left { overflow-x: hidden; }
.view { display: grid; grid-template-columns: 1fr; text-align: left; padding: 7px 10px; background: transparent; border: 1px solid transparent; border-radius: 7px; }
.view b { font-weight: 500; font-size: 13px; }
.view small { color: var(--dim); font-size: 11px; }
.view:hover { background: rgba(150, 172, 210, 0.08); }
.view.on { border-color: rgba(255, 178, 62, 0.45); background: rgba(255, 178, 62, 0.08); }
.view.on b { color: var(--sol); }
.view:disabled { opacity: 0.4; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { padding: 3px 9px; border-radius: 99px; border: 1px solid var(--rule-strong); background: transparent; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
.chip i { width: 6px; height: 6px; border-radius: 50%; }
.chip:hover { border-color: var(--dim); }
.chip.on { background: var(--ink); color: var(--void); border-color: var(--ink); }
.toggles { display: flex; gap: 12px; color: var(--dim); font-size: 12px; }
.toggles label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.toggles input { accent-color: var(--sol); margin: 0; }

#right { top: calc(14px + env(safe-area-inset-top, 0px)); right: 16px; width: 300px; max-height: calc(100% - 130px); overflow: auto; display: grid; gap: 10px; align-content: start; }
#right > section { padding: 14px; }
.info-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.info-head h3 { margin: 0; font: 700 20px/1.2 var(--serif); }
.kind { font-size: 11px; color: var(--dim); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 0 6px; }
.rows { display: grid; gap: 6px; margin: 0; }
.rows div { display: grid; grid-template-columns: 76px 1fr; gap: 8px; }
.rows dt { color: var(--dim); font-size: 12px; }
.rows dd { margin: 0; font: 12.5px/1.45 var(--mono); font-variant-numeric: tabular-nums; }
.rows dd em { font-style: normal; color: var(--dim); font-family: var(--sans); font-size: 11.5px; }
.fact { margin: 10px 0 0; padding-top: 10px; border-top: 1px solid var(--rule); color: #c9d1de; font-size: 12.5px; line-height: 1.6; }
.btn { padding: 6px 12px; border-radius: 7px; border: 1px solid var(--rule-strong); background: rgba(150, 172, 210, 0.06); font-size: 12.5px; }
.btn:hover { border-color: var(--dim); }
.btn.primary { background: var(--sol); color: var(--sol-ink); border-color: var(--sol); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.note-sm { margin: 8px 0 0; color: var(--dim); font-size: 11.5px; line-height: 1.5; }
.pulse { margin-top: 10px; padding: 8px 10px; border-radius: 7px; background: rgba(255, 210, 120, 0.07); border: 1px solid rgba(255, 210, 120, 0.2); font-size: 12px; }
.pulse b { font: 500 12.5px var(--mono); color: #ffd98f; }

/* Mission */
.seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--rule-strong); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 0; font-size: 12.5px; border-left: 1px solid var(--rule); }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--ink); color: var(--void); font-weight: 500; }
.field { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--dim); font-size: 12px; }
select { background: var(--panel-solid); border: 1px solid var(--rule-strong); border-radius: 6px; padding: 4px 6px; font-size: 12.5px; }
.plan { margin-top: 10px; font-size: 12.5px; color: #c9d1de; line-height: 1.6; }
.plan strong { color: var(--ink); font-weight: 600; }
.plan .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.plan .note { color: var(--dim); font-size: 11.5px; }
.pork { margin-top: 8px; }
.pork canvas { width: 100%; height: 132px; display: block; border-radius: 6px; background: #060a12; cursor: crosshair; }
.pork .axes { display: flex; justify-content: space-between; color: var(--faint); font: 10.5px var(--mono); margin-top: 3px; }
.phase { margin: 2px 0 8px; }
.phase b { display: block; font: 700 17px/1.3 var(--serif); color: var(--sol); }
.phase span { color: #c9d1de; font-size: 12.5px; }
.met { font: 500 22px var(--mono); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.timeline { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 2px; border-left: 1px solid var(--rule-strong); }
.timeline li button { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 4px 8px 4px 12px; border: 0; background: transparent; border-radius: 0 6px 6px 0; position: relative; font-size: 12.5px; color: var(--dim); }
.timeline li button::before { content: ""; position: absolute; left: -4px; top: 10px; width: 7px; height: 7px; border-radius: 50%; background: var(--void); border: 1px solid var(--faint); }
.timeline li.done button { color: #c9d1de; }
.timeline li.done button::before { background: var(--dim); border-color: var(--dim); }
.timeline li.now button { color: var(--sol); background: rgba(255, 178, 62, 0.08); }
.timeline li.now button::before { background: var(--sol); border-color: var(--sol); box-shadow: 0 0 8px var(--sol); }
.timeline li button:hover { background: rgba(150, 172, 210, 0.08); }
.timeline small { font: 11px var(--mono); color: var(--faint); }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--dim); cursor: pointer; }
.check input { accent-color: var(--sol); margin: 0; }

/* Surface HUD */
#surfaceHud { left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); padding: 10px 14px; display: grid; gap: 8px; width: min(640px, calc(100% - 32px)); }
.sh-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.sh-read { font: 12px var(--mono); color: #c9d1de; font-variant-numeric: tabular-nums; }
.sh-read em { font-style: normal; color: var(--sol); }
.sh-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.zoom { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 180px; color: var(--dim); font-size: 12px; }
.zoom input { flex: 1; accent-color: var(--sol); }

#cockpitHud { left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); padding: 10px 14px; display: grid; gap: 8px; width: min(640px, calc(100% - 32px)); }
#cockRead b { color: var(--sol); font-weight: 600; font-family: var(--sans); }
#cockRead em.hot { color: #ff9b4a; font-style: normal; }
#prograde { position: fixed; left: 0; top: 0; z-index: 1; width: 30px; height: 30px; margin: -15px 0 0 -15px; pointer-events: none; color: rgba(140, 255, 180, 0.85); }
#prograde svg { width: 100%; height: 100%; display: block; }
#scalebar { left: 50%; transform: translateX(-50%); text-align: center; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); pointer-events: none; font: 11.5px var(--mono); color: #c9d1de; text-shadow: 0 0 4px #000; }
#scalebar .bar { height: 6px; margin-inline: auto; border: 1px solid rgba(232,236,243,.8); border-top: 0; margin-bottom: 4px; }

/* Time dock */
#dock { left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding: 8px; display: flex; gap: 8px; align-items: center; max-width: calc(100% - 32px); }
.ibtn { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--rule-strong); background: rgba(150,172,210,.06); }
.ibtn svg { width: 16px; height: 16px; fill: currentColor; }
.ibtn.on { background: var(--sol); color: var(--sol-ink); border-color: var(--sol); }
.rates { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.rates::-webkit-scrollbar { display: none; }
.rates button { flex: none; padding: 7px 9px; border: 0; background: transparent; border-radius: 6px; font: 500 12px var(--mono); color: var(--dim); white-space: nowrap; }
.rates button:hover { color: var(--ink); }
.rates button.on { background: rgba(255, 178, 62, 0.14); color: var(--sol); }
.sep { width: 1px; align-self: stretch; background: var(--rule); flex: none; }
.jump { display: flex; gap: 6px; align-items: center; flex: none; }
.jump input { background: var(--panel-solid); border: 1px solid var(--rule-strong); border-radius: 6px; padding: 5px 6px; font: 12px var(--mono); width: 172px; }
.jump .btn { padding: 6px 10px; white-space: nowrap; }

#toast { position: fixed; z-index: 5; left: 50%; top: calc(96px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -8px); max-width: min(520px, calc(100% - 32px));
  padding: 9px 14px; border-radius: 8px; background: rgba(255, 178, 62, 0.95); color: var(--sol-ink); font-weight: 500; font-size: 13px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#loading { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding-inline: 24px; text-align: center; line-height: 1.8; background: var(--void); color: var(--dim); font: 14px var(--sans); letter-spacing: .1em; transition: opacity .6s; }
#loading.gone { opacity: 0; pointer-events: none; }
#loading b { display: block; font: 900 30px var(--serif); color: var(--ink); letter-spacing: .04em; margin-bottom: 8px; text-align: center; }
#loading b span { font: 500 24px var(--mono); color: var(--sol); }
.credit { position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 1; font-size: 10.5px; color: var(--faint); max-width: 240px; text-align: right; line-height: 1.4; }
.credit a { color: inherit; }
#tabs { display: none; }

@media (max-width: 1500px) { .credit { display: none; } }
@media (max-width: 980px) {
  .jump input, #btnJump { display: none; }
}
@media (max-width: 760px) {
  .brand h1 { font-size: 19px; } .brand h1 span { font-size: 16px; } .brand p { display: none; }
  .clock { left: auto; right: 16px; transform: none; text-align: right; }
  .clock .time { font-size: 22px; }
  #left, #right { top: auto; left: 16px; right: 16px; width: auto; bottom: calc(146px + env(safe-area-inset-bottom, 0px)); max-height: 52%; display: none; }
  body[data-sheet="views"] #left { display: grid; }
  body[data-sheet="info"] #right, body[data-sheet="mission"] #right { display: grid; }
  body[data-sheet="info"] #mission, body[data-sheet="mission"] #info { display: none; }
  #tabs { display: flex; position: fixed; z-index: 3; left: 16px; right: 16px; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); gap: 6px; }
  #tabs button { flex: 1; padding: 7px 0; border-radius: 8px; border: 1px solid var(--rule-strong); background: var(--panel); backdrop-filter: blur(10px); font-size: 13px; }
  #tabs button.on { background: var(--ink); color: var(--void); }
  #dock { left: 16px; right: 16px; transform: none; max-width: none; flex-wrap: wrap; }
  #dock .rates { flex: 1; min-width: 0; }
  #dock .sep { display: none; }
  .jump { width: 100%; }
  .jump .btn { flex: 1; }
  #surfaceHud { bottom: calc(146px + env(safe-area-inset-bottom, 0px)); }
  body[data-sheet="views"] #surfaceHud, body[data-sheet="info"] #surfaceHud, body[data-sheet="mission"] #surfaceHud { display: none; }
  #cockpitHud { bottom: calc(146px + env(safe-area-inset-bottom, 0px)); }
  body[data-sheet="views"] #cockpitHud, body[data-sheet="info"] #cockpitHud, body[data-sheet="mission"] #cockpitHud { display: none; }
  #scalebar { bottom: calc(136px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { #toast, #loading { transition: none; } }
</style>
</head>
<body data-sheet="none">
<canvas id="scene" aria-label="太阳系三维视图" data-en-aria="3D view of the Solar System"></canvas>
<div id="labels"></div>

<header class="hud brand"><div class="brand-row"><h1 data-en="Solar System<span>1:1</span>">太阳系<span>1:1</span></h1>
  <select id="langSel" aria-label="语言 / Language"><option value="auto">自动 · Auto</option><option value="zh">中文</option><option value="en">English</option></select></div>
  <p data-en="True scale · live ephemeris">真实比例 · 实时星历</p></header>

<div class="hud clock" aria-live="off">
  <div class="date" id="clockDate">—</div>
  <div class="time" id="clockTime">—</div>
  <div class="rate"><span id="clockRate">—</span><span class="badge" id="clockBadge" hidden data-en="Extrapolated ephemeris">星历外推</span></div>
</div>

<aside class="hud panel" id="left">
  <div>
    <h2 data-en="Views">视角</h2>
    <div class="views" id="views"></div>
  </div>
  <div>
    <h2 data-en="Bodies">天体</h2>
    <div class="chips" id="bodies"></div>
  </div>
  <div class="toggles">
    <label><input type="checkbox" id="tLabels" checked><span data-en="Labels">标签</span></label>
    <label><input type="checkbox" id="tOrbits" checked><span data-en="Orbits &amp; paths">轨道与航线</span></label>
    <label><input type="checkbox" id="tConst"><span data-en="Constellations">星座</span></label>
  </div>
</aside>

<aside class="hud" id="right">
  <section class="panel" id="info"></section>
  <section class="panel" id="mission"></section>
</aside>

<div class="hud panel" id="surfaceHud" hidden>
  <div class="sh-top">
    <div class="sh-row">
      <select id="siteSel" aria-label="所在地点" data-en-aria="Location"></select>
      <span class="sh-row" id="lookBtns"></span>
      <button class="btn" id="btnPass" hidden data-en="Next ISS pass" title="快进到空间站下一次在夜空中飞过" data-en-title="Jump to the next time the ISS crosses the night sky">等空间站飞过</button>
    </div>
    <button class="btn" id="btnLeave" data-en="Back to space">回到太空</button>
  </div>
  <div class="sh-read" id="surfRead"></div>
  <label class="zoom" for="fovRange"><span data-en="Zoom">望远镜</span><input type="range" id="fovRange" min="0" max="1000" value="700"><span id="fovText" class="sh-read">60°</span></label>
</div>

<div class="hud panel" id="cockpitHud" hidden>
  <div class="sh-top">
    <span class="sh-row" id="cockLooks"></span>
    <button class="btn" id="btnCockExit" data-en="Exit onboard view">退出驾驶视图</button>
  </div>
  <div class="sh-read" id="cockRead"></div>
</div>
<div id="prograde" hidden title="飞行方向" data-en-title="Direction of flight"><svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="15" cy="15" r="6"/><path d="M15 3v6M3 15h6M21 15h6"/></svg></div>

<div class="hud" id="scalebar"><div class="bar" id="scaleBar"></div><span id="scaleText"></span></div>

<div id="tabs">
  <button data-tab="views" data-en="Views">视角</button><button data-tab="info" data-en="Info">信息</button><button data-tab="mission" data-en="Mission">任务</button>
</div>

<nav class="hud panel" id="dock" aria-label="时间控制" data-en-aria="Time controls">
  <button class="ibtn" id="btnRev" title="时间倒流" aria-label="时间倒流" data-en-title="Reverse time" data-en-aria="Reverse time"><svg viewBox="0 0 16 16"><path d="M8 3V0L3 4.5 8 9V6a4 4 0 1 1-4 4H2a6 6 0 1 0 6-7z"/></svg></button>
  <button class="ibtn" id="btnPlay" title="暂停 / 继续（空格）" data-en-title="Pause / resume (Space)" aria-label="暂停"><svg viewBox="0 0 16 16" id="playIcon"><path d="M4 2h3v12H4zM9 2h3v12H9z"/></svg></button>
  <div class="rates" id="rates"></div>
  <div class="sep"></div>
  <div class="jump">
    <button class="btn" id="btnNow" data-en="Now">现在</button>
    <input type="datetime-local" id="jumpInput" aria-label="跳转到日期时间" data-en-aria="Jump to date and time">
    <button class="btn" id="btnJump" data-en="Go">跳转</button>
    <button class="btn" id="btnSolar" data-en="Solar eclipse" data-en-title="Jump to the next solar eclipse" title="跳到下一次日食">下次日食</button>
    <button class="btn" id="btnLunar" data-en="Lunar eclipse" data-en-title="Jump to the next lunar eclipse" title="跳到下一次月食">下次月食</button>
  </div>
